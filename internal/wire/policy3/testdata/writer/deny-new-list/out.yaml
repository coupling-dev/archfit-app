version: 3
owners: [alexei-led]
modules:
  pkg_tc:
    paths: [pkg/tc/**]
  pkg_util:
    paths: [pkg/util/**]
# Nothing is excepted yet.
rules:
  - id: no-tc-to-util
    deny:
      from: pkg_tc
      to: pkg_util
    why: A direct import ties the tc code to one helper.
    instead: Add a method to the tc client.
