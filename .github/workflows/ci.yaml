name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - run: CGO_ENABLED=0 go build ./...

  # The Test job skips the emulator cases. This job runs store/storetest and the cross-client races against the
  # official Firestore emulator, so the driver is checked against real Firestore semantics, not only the fake.
  firestore-emulator:
    name: Store on the Firestore emulator
    runs-on: ubuntu-24.04
    env:
      EMULATOR_IMAGE: gcr.io/google.com/cloudsdktool/google-cloud-cli:587.0.0-emulators@sha256:8d8573471c489a409f03891d2c24d177fa531276184f7002b9a2d853d1b3ed54
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8086
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Start the Firestore emulator
        run: |
          docker run --detach --name firestore --publish 127.0.0.1:8086:8086 "$EMULATOR_IMAGE" \
            gcloud emulators firestore start --host-port=0.0.0.0:8086
          for _ in $(seq 90); do
            if curl --silent --fail "http://$FIRESTORE_EMULATOR_HOST/" >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs firestore
          exit 1
      - run: go test -race -count=1 -timeout=15m -v ./internal/store/firestore/
      - name: Emulator logs
        if: failure()
        run: docker logs firestore

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Same minor version as the engine repository: patch releases float, new linters arrive only with a bump.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.14

  image:
    name: Image builds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t archfit-app:ci .

  # The App owns the envelope schema; archfit-action vendors a copy (decisions.md §3). action-conformance checks the
  # copy at the Action commit that generated workflows pin. If the manifest ever pins a placeholder commit there is
  # nothing to check: action-pin says so in a warning and the step summary, and action-conformance shows as skipped.
  action-pin:
    name: Pinned Action commit
    runs-on: ubuntu-24.04
    outputs:
      placeholder: ${{ steps.pin.outputs.placeholder }}
      ref: ${{ steps.pin.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
      - id: pin
        name: Read the pinned Action commit
        run: |
          refs=$(jq -r '[.entries[].action_ref] | unique | .[]' internal/wire/manifest/manifest.json)
          if [[ $(grep -c . <<<"$refs") -ne 1 ]]; then
            echo "::error::manifest rows pin different action_ref values; the conformance check needs one Action commit"
            exit 1
          fi
          ref=$refs
          # A placeholder is one repeated character, the rule of TestManifestHasNoPlaceholdersInRelease.
          if [[ -z $(tr -d "${ref:0:1}" <<<"$ref") ]]; then
            echo "::warning title=Action conformance not verified::action_ref $ref is a placeholder; the vendored envelope schema of archfit-action was not compared"
            {
              echo "### Action envelope schema: not verified"
              echo ""
              echo "The manifest pins the placeholder action_ref \`$ref\`. No archfit-action commit was checked out and"
              echo "\`schema/envelope.v1.schema.json\` was not compared with \`internal/wire/envelope/envelope.v1.schema.json\`."
            } >>"$GITHUB_STEP_SUMMARY"
            echo "placeholder=true" >>"$GITHUB_OUTPUT"
          else
            echo "placeholder=false" >>"$GITHUB_OUTPUT"
          fi
          echo "ref=$ref" >>"$GITHUB_OUTPUT"

  action-conformance:
    name: Action envelope schema
    needs: action-pin
    if: needs.action-pin.outputs.placeholder == 'false'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: alexei-led/archfit-action
          ref: ${{ needs.action-pin.outputs.ref }}
          path: archfit-action
          persist-credentials: false
      - name: Compare the vendored envelope schema
        env:
          REF: ${{ needs.action-pin.outputs.ref }}
        run: |
          if ! cmp -s internal/wire/envelope/envelope.v1.schema.json archfit-action/schema/envelope.v1.schema.json; then
            echo "::error::archfit-action@$REF vendors a different envelope schema; re-vendor schema/envelope.v1.schema.json there, then pin the new commit"
            diff -u internal/wire/envelope/envelope.v1.schema.json archfit-action/schema/envelope.v1.schema.json || true
            exit 1
          fi
          echo "### Action envelope schema: identical at archfit-action@\`$REF\`" >>"$GITHUB_STEP_SUMMARY"
