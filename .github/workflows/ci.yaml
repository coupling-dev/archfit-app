name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ARCHFIT_RELEASE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - run: CGO_ENABLED=0 go build ./...

  # The web app: types, unit tests, the build, the bundle budget, and a browser smoke test of the build under the
  # production CSP with axe. The Go jobs need none of it: without a build the App embeds a notice page.
  web:
    name: Web app
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run ci

  # The Test job skips the emulator cases. This job runs store/storetest and the cross-client races against the
  # official Firestore emulator, so the driver is checked against real Firestore semantics, not only the fake.
  firestore-emulator:
    name: Store on the Firestore emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EMULATOR_IMAGE: gcr.io/google.com/cloudsdktool/google-cloud-cli:587.0.0-emulators@sha256:8d8573471c489a409f03891d2c24d177fa531276184f7002b9a2d853d1b3ed54
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8086
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Start the Firestore emulator
        run: |
          docker run --detach --name firestore --publish 127.0.0.1:8086:8086 "$EMULATOR_IMAGE" \
            gcloud emulators firestore start --host-port=0.0.0.0:8086
          for _ in $(seq 90); do
            if curl --silent --fail "http://$FIRESTORE_EMULATOR_HOST/" >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs firestore
          exit 1
      - run: go test -race -count=1 -timeout=15m -v ./internal/store/firestore/
      - name: Emulator logs
        if: failure()
        run: docker logs firestore

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The latest minor, as on the workstations: patch releases float, new linters arrive only with a bump.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.15

  # Offline checks only: no backend, no credentials, no plan. The owner plans and applies (infra/README.md).
  infra:
    name: Terraform
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.1
          tofu_wrapper: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.61.0
      - run: tofu fmt -check -recursive infra
      - name: Validate and test each stack
        run: |
          for stack in infra/data infra/runtime; do
            tofu -chdir="$stack" init -backend=false -input=false -lockfile=readonly
            tofu -chdir="$stack" validate
            tofu -chdir="$stack" test
          done
      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --chdir=infra --init --config="$PWD/infra/.tflint.hcl"
          tflint --chdir=infra --recursive --config="$PWD/infra/.tflint.hcl"

  # The release scripts run only on main with Google Cloud credentials, so CI tests them with fakes on every change.
  deploy-scripts:
    name: Deploy scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends bats
      - run: make deploy-check ACTIONLINT="go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12"

  image:
    name: Image builds
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t archfit-app:ci .

  # Qualify every distinct manifest Action commit against the App-owned envelope schema. Keep these jobs static:
  # both names are required checks, including during a transition with more than one supported engine release.
  action-pin:
    name: Pinned Action commit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      refs: ${{ steps.pin.outputs.refs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: pin
        name: Read the pinned Action commits
        run: |
          set -euo pipefail
          refs=$(jq -ce '[.entries[].action_ref] | if length > 0 and all(.[]; type == "string" and length == 40 and test("^[0-9a-f]{40}$")) then unique else error("manifest needs nonempty 40-hex Action refs") end' internal/wire/manifest/manifest.json)
          while IFS= read -r ref; do
            if [[ -z ${ref//${ref:0:1}/} ]]; then
              echo "::error::manifest Action ref is a placeholder: $ref"
              exit 1
            fi
          done < <(jq -r '.[]' <<<"$refs")
          echo "refs=$refs" >>"$GITHUB_OUTPUT"

  action-conformance:
    name: Action envelope schema
    needs: action-pin
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare every vendored envelope schema
        env:
          ACTION_REFS: ${{ needs.action-pin.outputs.refs }}
        run: |
          set -euo pipefail
          refs=$(jq -er 'if type == "array" and length > 0 and all(.[]; type == "string" and length == 40 and test("^[0-9a-f]{40}$")) then .[] else error("invalid Action refs") end' <<<"$ACTION_REFS")
          # The hosted runner removes its temporary directory after the job.
          checkout=$(mktemp -d "$RUNNER_TEMP/action-conformance.XXXXXX")
          git -C "$checkout" init --quiet
          while IFS= read -r ref; do
            if [[ -z ${ref//${ref:0:1}/} ]]; then
              echo "::error::placeholder Action ref: $ref"
              exit 1
            fi
            git -C "$checkout" fetch --quiet --depth=1 https://github.com/alexei-led/archfit-action.git "$ref"
            test "$(git -C "$checkout" rev-parse FETCH_HEAD)" = "$ref"
            git -C "$checkout" show FETCH_HEAD:schema/envelope.v1.schema.json >"$checkout/envelope.json"
            if ! cmp -s internal/wire/envelope/envelope.v1.schema.json "$checkout/envelope.json"; then
              echo "::error::archfit-action@$ref vendors a different envelope schema; re-vendor it and pin the new commit"
              diff -u internal/wire/envelope/envelope.v1.schema.json "$checkout/envelope.json" || true
              exit 1
            fi
            echo "### Action envelope schema: identical at archfit-action@\`$ref\`" >>"$GITHUB_STEP_SUMMARY"
          done <<<"$refs"
